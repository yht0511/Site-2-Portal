site:
  title: Site-2中央路由系统
  mark: TECLAB
  loading:
    minDuration: 1000
    status: 正在检测网络环境

adapters:
  - id: schoolNetwork
    name: 校园网检测
    mode: https-probe
    variable: isSchoolNetwork
    config:
      url: https://bitshare.lan.site-2.teclab.org.cn/
      timeout: 2500
      successValue: true
      failureValue: false
      successText: 校内网络
      failureText: 校外网络

  - id: always
    name: 默认可用
    mode: constant
    variable: always
    config:
      value: true
      text: 可用

services:
  - id: site2-bitshare
    name: Bitshare
    links:
      - label: 校内入口
        url: https://bitshare.lan.site-2.teclab.org.cn/
        when: isSchoolNetwork
      - label: 公网入口
        url: https://bitshare.site-2.teclab.org.cn:10043/
        when: "!isSchoolNetwork"

  - id: site2-bitshare-search
    name: Bitshare Search
    links:
      - label: 校内入口
        url: https://bitshare-search.lan.site-2.teclab.org.cn/
